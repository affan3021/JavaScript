<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <meta http-equiv="UX-A-Compatible" content="IE=Edge"/>
        <title>Weather API - Affan</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>
            <input id="cityInput" type="text" placeholder="Enter the City: ">
            <button id="search">Search</button>
            <button id="clear">Clear</button>
        </div>
        <div id="weather-elements">
            <h2 id="heading"></h2>
            <p id="dispLoc"></p>
            <p id="time"></p>
            <p id="temp"></p>
            <p id="feels-like"></p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
